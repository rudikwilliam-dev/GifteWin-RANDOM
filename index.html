<style>
:root{--bg:#120d08;--bg2:#1a130e;--card:#261c15;--card2:#30241b;--line:rgba(255,255,255,.07);--gold:#c9a227;--gold2:#e8c547;--brown:#8b5e3c;--text:#f3ede4;--muted:#a89888;--r:14px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font-family:inherit;font-size:inherit}
a{color:inherit;text-decoration:none}
.hide{display:none!important}

/* LOADER */
.loader{position:fixed;inset:0;z-index:999;background:radial-gradient(ellipse at 50% 28%,#2a1c10 0%,var(--bg) 70%);display:flex;align-items:center;justify-content:center;transition:opacity .4s,visibility .4s}
.loader.out{opacity:0;visibility:hidden;pointer-events:none}
.loader-box{text-align:center;padding:24px}
.logo-wrap{position:relative;width:110px;height:110px;margin:0 auto 22px}
.logo-svg{width:100%;height:100%;animation:float 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 28px rgba(201,162,39,.4))}
.logo-ring{position:absolute;inset:-14px;border:2px solid rgba(201,162,39,.2);border-top-color:var(--gold);border-radius:50%;animation:spin 7s linear infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-title{font-size:26px;font-weight:800;margin-bottom:20px}
.loader-title span{color:var(--gold);font-weight:600}
.loader-bar{width:170px;height:3px;margin:0 auto 12px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.loader-fill{height:100%;width:0;background:linear-gradient(90deg,var(--brown),var(--gold));border-radius:3px;transition:width .3s}
.loader-hint{color:var(--muted);font-size:13px}

/* APP */
.app{min-height:100%;padding-bottom:calc(24px + var(--safe));animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--bg) 65%,transparent);backdrop-filter:blur(8px)}
.hdr-l{display:flex;align-items:center;gap:10px}
.hdr-ico{width:36px;height:36px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.hdr-ico svg{width:26px;height:26px}
.hdr-name{font-weight:700;font-size:15px;line-height:1.1}
.hdr-tag{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:1px}
.btn-ch{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#0077b5,#00a0e3);color:#fff;font-size:12px;font-weight:600;padding:7px 12px;border-radius:18px;box-shadow:0 3px 12px rgba(0,136,204,.35)}
.btn-ch:active{transform:scale(.96)}

.user{display:flex;align-items:center;gap:11px;margin:2px 16px 12px;padding:11px 13px;background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--brown),var(--gold));color:#120d08;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
.um{flex:1;min-width:0}
.un{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ul{font-size:12px;color:var(--muted);margin-top:1px}
.btn-ref{width:36px;height:36px;border-radius:10px;flex-shrink:0;background:rgba(201,162,39,.12);border:1px solid rgba(201,162,39,.28);color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-ref:active{background:rgba(201,162,39,.22)}

.tabs{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}

.tab{flex-shrink:0;border:1px solid transparent;background:var(--card);color:var(--muted);padding:8px 13px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.tab.on{background:rgba(201,162,39,.15);border-color:rgba(201,162,39,.35);color:var(--gold2)}

.main{padding:0 16px}
.panel{display:none;animation:up .25s ease}
.panel.on{display:block}
.sec{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:9px}

.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:13px;border:1px solid var(--line);cursor:pointer;transition:background .12s,transform .1s}
.card:active{background:var(--card2);transform:scale(.985)}
.card-media{width:100%;height:120px;border-radius:10px;object-fit:cover;margin-bottom:10px;background:var(--card2)}
.card-top{display:flex;gap:9px;margin-bottom:6px}
.card-em{font-size:24px;line-height:1}
.card-inf{flex:1;min-width:0}
.card-ti{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tm{font-size:12px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;margin-top:2px}
.card-pr{font-size:12px;font-weight:600;color:var(--gold2);margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:5px}
.badge{display:inline-flex;align-items:center;gap:3px;background:rgba(0,136,204,.18);color:#5bc0ff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px}
.preview{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:10px;background:rgba(255,255,255,.05);padding:2px 6px;border-radius:5px;color:var(--muted)}
.pill b{color:var(--gold2)}
.empty{text-align:center;padding:32px 14px;color:var(--muted);font-size:13px;line-height:1.5}

.form{display:flex;flex-direction:column;gap:13px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:vertical;min-height:52px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:7px 11px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:rgba(201,162,39,.18);border-color:var(--gold);color:var(--gold2)}
.check{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--gold)}
.btn-go{margin-top:2px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--brown),var(--gold));color:#120d08;font-size:15px;font-weight:700;padding:13px;border-radius:12px;box-shadow:0 5px 18px rgba(201,162,39,.3)}

.media-prev img,.media-prev video{width:100%;max-height:140px;object-fit:cover;display:block}

.list-top{display:flex;flex-direction:column;gap:6px}
.top-r{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:10px;border:1px solid var(--line)}
.top-rk{font-size:15px;width:24px;text-align:center}
.top-nm{flex:1;font-weight:600;font-size:13px}
.top-bl{color:var(--gold);font-weight:700;font-size:13px}

.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;padding:10px;animation:up .2s}
.sheet{background:var(--bg2);width:100%;max-width:440px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 12px 12px;padding:20px 15px 26px;position:relative;border:1px solid rgba(201,162,39,.12);animation:sheet .28s ease}

.mx{position:absolute;top:8px;right:12px;background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1}
.m-media{width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-bottom:12px;background:var(--card)}
.m-ti{font-size:17px;font-weight:700;margin-bottom:3px;padding-right:26px}
.m-pr{color:var(--gold);font-weight:600;font-size:13px;margin-bottom:8px}
.m-tm{text-align:center;font-size:24px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.5px;margin:4px 0 10px;background:rgba(201,162,39,.1);padding:11px;border-radius:11px;border:1px solid rgba(201,162,39,.2)}
.m-meta{display:flex;flex-wrap:wrap;gap:9px;font-size:12px;color:var(--muted);margin-bottom:10px}
.m-ds{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.4}
.stats{display:flex;gap:6px;margin-bottom:12px}
.st{flex:1;text-align:center;padding:8px 5px;background:var(--card);border-radius:9px;border:1px solid var(--line)}
.st span{display:block;font-size:10px;color:var(--muted);margin-bottom:2px}
.st b{font-size:14px;color:var(--gold2)}
.plbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px}
.parts{max-height:220px;overflow-y:auto}
.part{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.part:last-child{border-bottom:none}
.p-l{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.p-n{width:19px;height:19px;border-radius:5px;flex-shrink:0;background:rgba(201,162,39,.15);color:var(--gold);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.p-nm{font-weight:500;font-size:13px}
.p-sub{font-size:11px;color:var(--muted);margin-top:1px}
.p-r{text-align:right;min-width:60px}
.p-pct{font-weight:700;font-size:12px;color:var(--gold)}
.bar{height:3px;background:rgba(255,255,255,.07);border-radius:3px;margin-top:3px;overflow:hidden}
.bar-f{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--brown),var(--gold))}
.btn-j{width:100%;margin-top:14px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--brown),var(--gold));color:#120d08;font-size:15px;font-weight:700;padding:13px;border-radius:12px;box-shadow:0 5px 18px rgba(201,162,39,.3)}
.btn-j:disabled{opacity:.4;cursor:not-allowed}

.win-banner{background:linear-gradient(135deg,rgba(201,162,39,.2),rgba(139,94,60,.15));border:1px solid rgba(201,162,39,.35);border-radius:12px;padding:14px;text-align:center;margin-bottom:12px}
.win-banner h3{font-size:16px;margin-bottom:4px}
.win-banner p{font-size:12px;color:var(--muted)}

.toast{position:fixed;bottom:calc(20px + var(--safe));left:50%;transform:translateX(-50%);z-index:200;background:var(--card);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid rgba(201,162,39,.3);box-shadow:0 8px 24px rgba(0,0,0,.45);animation:up .2s;white-space:nowrap}
</style>
</head>

function cd(iso){var d=new Date(iso)-Date.now();if(d<=0)return '🏁 Итоги';var days=Math.floor(d/86400000),h=Math.floor((d%86400000)/3600000),m=Math.floor((d%3600000)/60000),s=Math.floor((d%60000)/1000);if(days>0)return days+'д '+pad(h)+':'+pad(m)+':'+pad(s);if(h>0)return pad(h)+':'+pad(m)+':'+pad(s);return pad(m)+':'+pad(s)}
function em(t){return {gift:'🎁',stars:'⭐',nft:'🖼',other:'📦'}[t]||'🎁'}
function ch(list){var tot=list.reduce(function(s,p){return s+100+(p.luck_at_join||0)},0);return list.map(function(p){var w=100+(p.luck_at_join||0);return Object.assign({},p,{weight:w,chance:tot?(w/tot*100):0})}).sort(function(a,b){return b.chance-a.chance})}
function nm(p){return p.username?'@'+p.username:(p.full_name||('ID'+p.user_id))}
function toast(m){var el=document.getElementById('toast');el.textContent=m;el.classList.remove('hide');setTimeout(function(){el.classList.add('hide')},2400)}

function runLoader(cb){var f=document.getElementById('fill'),h=document.getElementById('hint'),steps=[[30,'Подключение...'],[60,'Профиль...'],[90,'Розыгрыши...'],[100,'Готово!']],i=0;var t=setInterval(function(){if(i>=steps.length){clearInterval(t);setTimeout(function(){document.getElementById('loader').classList.add('out');setTimeout(function(){document.getElementById('loader').classList.add('hide');document.getElementById('app').classList.remove('hide');cb()},400)},200);return}f.style.width=steps[i][0]+'%';h.textContent=steps[i][1];i++},360)}

function cardHtml(g){
  var c=ch(g.participants);
  var top=c.slice(0,3).map(function(p){return '<span class="pill">'+esc(nm(p))+' <b>'+p.chance.toFixed(0)+'%</b></span>'}).join('')||'<span class="pill">Никого нет</span>';
  var media=g.prize_media?'<img class="card-media" src="'+esc(g.prize_media)+'" alt="prize" onerror="this.style.display=\'none\'">':'';
  var done=g.status==='finished';
  return '<div class="card" data-id="'+g.id+'">'+media+
    '<div class="card-top"><div class="card-em">'+em(g.prize_type)+'</div><div class="card-inf"><div class="card-ti">'+esc(g.title)+'</div><div class="card-tm" data-end="'+g.end_at+'">'+(done?'✅ Завершён':cd(g.end_at))+'</div></div></div>'+
    '<div class="card-pr">'+esc(g.prize_info)+'</div>'+
    '<div class="card-row"><span>👥 '+g.participants.length+'</span><span>🏆 ×'+g.winners_count+'</span>'+(g.boost_required?'<span class="badge">🚀 Boost</span>':'')+(done?'<span class="badge" style="background:rgba(76,175,80,.2);color:#81c784">Итоги</span>':'')+'</div>'+
    '<div class="preview">'+top+'</div></div>';
}

function renderA(){var el=document.getElementById('listA');if(!S.giveaways.length){el.innerHTML='<div class="empty">Нет активных розыгрышей</div>';return}el.innerHTML=S.giveaways.map(cardHtml).join('');el.querySelectorAll('.card').forEach(function(c){c.onclick=function(){openM(+c.dataset.id)}})}
function renderM(){var el=document.getElementById('listM');if(!S.my.length){el.innerHTML='<div class="empty">Ты ещё ничего не создавал</div>';return}el.innerHTML=S.my.map(cardHtml).join('');el.querySelectorAll('.card').forEach(function(c){c.onclick=function(){openM(+c.dataset.id)}})}
function renderT(){var m=['🥇','🥈','🥉'];document.getElementById('listT').innerHTML=S.top.map(function(u,i){var n=u.username?'@'+u.username:u.full_name;return '<div class="top-r"><div class="top-rk">'+(m[i]||(i+1)+'.')+'</div><div class="top-nm">'+esc(n)+'</div><div class="top-bl">🍀 '+u.luck_balls+'</div></div>'}).join('')}

function openM(id){
  var g=S.giveaways.find(function(x){return x.id===id})||S.my.find(function(x){return x.id===id});if(!g)return;
  var c=ch(g.participants),joined=g.participants.some(function(p){return p.user_id===S.user.id});
  var tot=c.reduce(function(s,p){return s+p.weight},0),avg=c.length?(100/c.length):0;
  var media=g.prize_media?'<img class="m-media" src="'+esc(g.prize_media)+'" alt="prize" onerror="this.style.display=\'none\'">':'';
  var winHtml='';
  if(g.status==='finished'&&g.winners&&g.winners.length){
    var names=g.winners.map(function(wid){var p=g.participants.find(function(x){return x.user_id===wid});return p?nm(p):('ID'+wid)}).join(', ');
    winHtml='<div class="win-banner"><h3>🎉 Победители</h3><p>'+esc(names)+'</p><p style="margin-top:6px">Приз: <b style="color:var(--gold)">'+esc(g.prize_info)+'</b></p></div>';
  }
  var parts='';
  if(c.length){
    parts='<div class="stats"><div class="st"><span>Участников</span><b>'+c.length+'</b></div><div class="st"><span>Сумм. вес</span><b>'+tot+'</b></div><div class="st"><span>Ср. шанс</span><b>'+avg.toFixed(1)+'%</b></div></div><div class="plbl">Участники и шансы</div><div class="parts">'+
      c.map(function(p,i){return '<div class="part"><div class="p-l"><div class="p-n">'+(i+1)+'</div><div><div class="p-nm">'+esc(nm(p))+'</div><div class="p-sub">🍀 '+(p.luck_at_join||0)+' · вес '+p.weight+'</div></div></div><div class="p-r"><div class="p-pct">'+p.chance.toFixed(1)+'%</div><div class="bar"><div class="bar-f" style="width:'+Math.max(3,p.chance)+'%"></div></div></div></div>'}).join('')+'</div>';
  } else parts='<div class="empty" style="padding:16px 0">Пока никто не участвует</div>';

  document.getElementById('mb').innerHTML=media+'<div class="m-ti">'+em(g.prize_type)+' '+esc(g.title)+'</div><div class="m-pr">'+esc(g.prize_info)+'</div>'+
    (g.status!=='finished'?'<div class="m-tm" data-end="'+g.end_at+'">'+cd(g.end_at)+'</div>':'')+
    '<div class="m-meta"><span>👥 '+g.participants.length+'</span><span>🏆 '+g.winners_count+'</span>'+(g.boost_required?'<span class="badge">🚀 Boost</span>':'')+'</div>'+
    (g.description?'<p class="m-ds">'+esc(g.description)+'</p>':'')+winHtml+parts+
    (g.status==='active'?'<button class="btn-j" id="bj"'+(joined?' disabled':'')+'>'+(joined?'✅ Ты уже участвуешь':(g.boost_required?'🚀 Участвовать (Boost)':'🎯 Участвовать'))+'</button>':'');

  document.getElementById('modal').classList.remove('hide');
  var bj=document.getElementById('bj');
  if(bj&&!joined){bj.onclick=function(){if(g.boost_required)toast('Проверка Boost...');setTimeout(function(){g.participants.push({user_id:S.user.id,username:S.user.username,full_name:S.user.first_name,luck_at_join:S.user.luck_balls});toast('✅ Ты в деле! 🍀');closeM();renderA();if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success')},g.boost_required?600:0)}}
}
function closeM(){document.getElementById('modal').classList.add('hide')}

/* auto finish demo when timer hits 0 */
function checkFinish(){
  S.giveaways.forEach(function(g){
    if(g.status!=='active')return;
    if(new Date(g.end_at)-Date.now()>0)return;
    if(!g.participants.length){g.status='finished';g.winners=[];return}
    var c=ch(g.participants),pool=c.slice(),w=[];
    for(var i=0;i<Math.min(g.winners_count,pool.length);i++){
      var tot=pool.reduce(function(s,p){return s+p.weight},0),r=Math.random()*tot,acc=0,idx=0;
      for(var j=0;j<pool.length;j++){acc+=pool[j].weight;if(r<=acc){idx=j;break}}
      w.push(pool[idx].user_id);pool.splice(idx,1);
    }
    g.status='finished';g.winners=w;
    if(w.indexOf(S.user.id)>=0)toast('🎉 Ты выиграл: '+g.prize_info);
  });
}

function setupForm(){
  var type='gift',wins=1,time='+6h';
  function bind(id,fn){document.getElementById(id).querySelectorAll('.chip').forEach(function(b){b.onclick=function(){document.getElementById(id).querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});b.classList.add('on');fn(b.dataset.v)}})}
  bind('cType',function(v){type=v});bind('cWin',function(v){wins=+v});bind('cTime',function(v){time=v});
  document.getElementById('fMedia').oninput=function(){var v=this.value.trim(),box=document.getElementById('mediaPrev');if(v&&/\.(gif|png|jpe?g|webp)(\?|$)/i.test(v)){box.style.display='block';box.innerHTML='<img src="'+esc(v)+'" alt="preview" onerror="this.parentNode.style.display=\'none\'">'}else{box.style.display='none';box.innerHTML=''}};
  document.getElementById('form').onsubmit=function(e){
    e.preventDefault();
    var title=document.getElementById('fTitle').value.trim(),desc=document.getElementById('fDesc').value.trim(),prize=document.getElementById('fPrize').value.trim(),media=document.getElementById('fMedia').value.trim(),boost=document.getElementById('fBoost').checked;
    if(!title||!prize){toast('Заполни название и приз');return}
    var end=new Date();if(time==='+1h')end.setHours(end.getHours()+1);else if(time==='+6h')end.setHours(end.getHours()+6);else if(time==='+1d')end.setDate(end.getDate()+1);else if(time==='+3d')end.setDate(end.getDate()+3);
    var g={id:Date.now(),title:title,description:desc,prize_type:type,prize_info:prize,prize_media:media,winners_count:wins,end_at:end.toISOString(),boost_required:boost,status:'active',winners:[],participants:[]};
    S.giveaways.unshift(g);S.my.unshift(g);toast('🎉 Розыгрыш создан!');if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');
    switchT('active');document.getElementById('form').reset();document.getElementById('mediaPrev').style.display='none';
  };
}

function switchT(n){document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.t===n)});document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',p.id==='p-'+n)});if(n==='active')renderA();if(n==='my')renderM();if(n==='top')renderT()}

function init(){
  var u=S.user;
  document.getElementById('nick').textContent=u.username?'@'+u.username:u.first_name;
  document.getElementById('luck').textContent=u.luck_balls;
  document.getElementById('av').textContent=(u.first_name||'U').charAt(0).toUpperCase();
  document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){switchT(t.dataset.t)}});
  document.getElementById('ref').onclick=function(){var link='https://t.me/GifteWinBot?start=ref_'+u.id;if(tg)tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent('Присоединяйся к GifteWin RANDOM! 🎁'));else{navigator.clipboard.writeText(link);toast('Ссылка скопирована')}};
  document.getElementById('mx').onclick=closeM;
  document.getElementById('modal').onclick=function(e){if(e.target.id==='modal')closeM()};
  setupForm();renderA();renderT();
  setInterval(function(){document.querySelectorAll('[data-end]').forEach(function(el){el.textContent=cd(el.dataset.end)});checkFinish()},1000);
}

runLoader(init);
})();
</script>
</body>
</html>
